  $('authSubmit').disabled=true;

      $('gameWrap').style.display='';

      authMessage('');
    }
  }catch(e){
    console.error(e);
    let msg=e.message||'로그인에 실패했습니다.';

function makeSaveCode(){
  s.last=Date.now();
  const payload={v:1,game:s,createdAt:Date.now()};
  const bytes=new TextEncoder().encode(JSON.stringify(payload));
  let bin='';for(let i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);
  return 'PP1-'+btoa(bin);
}
function readSaveCode(code){
  const raw=(code||'').trim();
  if(!raw.startsWith('PP1-'))throw new Error('저장 코드 형식이 올바르지 않습니다.');
  const bin=atob(raw.slice(4));
  const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
  const payload=JSON.parse(new TextDecoder().decode(bytes));
  if(!payload||payload.v!==1||!payload.game||typeof payload.game!=='object')throw new Error('저장 데이터가 올바르지 않습니다.');
  const x=Object.assign(structuredClone(base),payload.game);
  if(!Array.isArray(x.dex))x.dex=[x.species||'sprout'];
  x.refuse=Object.assign({feed:0,play:0,bath:0,train:0,touch:0},x.refuse||{});
  x.last=Date.now();
  return x;
}

  $('authUsername').value='';$('authPassword').value='';
  authMessage('로그아웃되었습니다.',true);
};
function gameTick(){if(!s.hatched)return;s.care=s.care||{feed:0,sleep:0,energy:0,hyg:0};s.food=clamp(s.food-2);s.ene=clamp(s.ene+(s.sleeping?3:1));s.hyg=clamp(s.hyg-(s.sleeping?0:1));s.joy=clamp(s.joy-(s.food<30?3:1));if(s.food>=45&&s.food<=90)s.care.feed+=1;if(s.sleeping)s.care.sleep+=1;if(s.ene>=60)s.care.energy+=1;if(s.hyg>=70)s.care.hyg+=1;if(s.sleeping&&s.ene>=100)s.sleeping=false;if(s.level<current().at)gainExp(1);checkGrowth();save();render()}
try{const h=location.hash||'';if(h.startsWith('#resume=')){const code=decodeURIComponent(h.slice(8));const x=readSaveCode(code);s=x;const resumeData=JSON.stringify(s);localStorage.setItem(KEY,resumeData);localStorage.setItem(BACKUP_KEY,resumeData);history.replaceState(null,'',location.pathname+location.search);setTimeout(()=>{log('📱 이어하기 링크로 저장 데이터를 불러왔습니다!');fx('RESUME!')},100)} }catch(e){console.warn('resume link load failed',e)}
setInterval(gameTick,30000);setInterval(()=>{$('clock').textContent=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});},1000);
render();log('Pocket Pet을 시작합니다. 로그인해 주세요.');initCloudAuth();if(awayResetNotice){setTimeout(()=>{modal('<h3>🏡 펫이 고향으로 돌아갔어요</h3><p><b>'+awayResetNotice.days+'일</b> 동안 게임에 접속하지 않아 '+awayResetNotice.name+'이(가) 고향으로 돌아갔습니다.</p><p>새로운 인연을 다시 시작해 주세요. 이번에는 <b>알</b>부터 다시 키울 수 있습니다. 🥚</p><div class="choice"><button class="btn primary" id="closeAway">🥚 새 알과 시작하기</button></div>');setTimeout(()=>{$('closeAway')&&($('closeAway').onclick=()=>{$('modal').classList.remove('open')})},0)},250)}$('clock').textContent=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
})();
</script>
