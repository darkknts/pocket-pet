name: Build redesigned pet atlas

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Render SVG atlas to PNG
        run: |
          npm install --no-save sharp
          node -e "require('sharp')('images/pet_atlas_redesigned.svg').png().toFile('images/pet_atlas_exact78_96q.png').then(()=>console.log('atlas generated'))"
      - name: Commit generated PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/pet_atlas_exact78_96q.png
          git diff --cached --quiet && exit 0
          git commit -m "chore: generate redesigned pet atlas [skip ci]"
          git push
