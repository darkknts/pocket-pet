name: Pixelize existing pet atlas

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  pixelize-atlas:
    if: github.event.head_commit.message != 'chore: pixelize existing pet atlas'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pixelize the existing atlas without redesigning it
        run: |
          git show 05d6b16ff453ebfdce07d06d89bb0d74099a74c9:images/pet_atlas_exact78_96q.png > /tmp/original.png
          file /tmp/original.png
          identify /tmp/original.png
          convert /tmp/original.png -resize 50% -filter point -resize 200% -filter point images/pet_atlas_exact78_96q.png
          rm -f images/pet_atlas_redesigned.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/pet_atlas_exact78_96q.png images/pet_atlas_redesigned.svg
          git commit -m "chore: pixelize existing pet atlas" || exit 0
          git push
